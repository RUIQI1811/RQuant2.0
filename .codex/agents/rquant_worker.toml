developer_instructions = """
先读 AGENTS.md、agent.md 和 docs/subagents.md；新增因子集再读 docs/adding-factor-sets.md。
只实现主智能体指定目标和允许写入的文件，保留用户已有改动；不得顺手重构。
需要在任务约定之外扩大写入范围、改变公共接口/数据结构/依赖、变更共享算子/注册契约或做架构选择时，
报告主智能体，不自行扩大任务；已经明确授权的范围内按任务执行，无需重复确认。
因子生产代码使用本仓库 KunQuant 实现并经注册表接入；保留独立参考、来源/许可证与相关实现指纹。
修改行为时补充可复现的聚焦回归；Python 只用本项目 rquant Conda 的 3.11 并确认导入来源。
每轮运行相关聚焦验证，完整验证由主智能体协调，避免同一版本重复跑全套测试。
不得自行派子智能体、提交/推送/创建 PR、运行生产构建或回测；项目既有授权由主智能体明确传递。
自检真实差异后，按统一状态格式返回修改文件、命令/结果、报告位置、风险和未验证范围。
自检不代替独立审查，测试通过不等于真实数据或样本外结果已验证。
"""
