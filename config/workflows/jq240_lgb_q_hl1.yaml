# jq240 LightGBM retraining variant `q_hl1`: the built-in lgb workflow (Qlib's Alpha158 / CSI300 parameters, early
# stopping on the validation loss) with quarterly retraining, training rows weighted with a one-year half-life.
#
# One of three variants (q, q_hl1, q_hl2) compared against the built-in lgb workflow on 2013-2021 only; see
# docs/lgb-tuning.md ("季度重训和近期加权") for the protocol and commands. Run with
#   rquant --universe sh_main walk-forward --workflow config/workflows/jq240_lgb_q_hl1.yaml --last-year 2021
# Every window trains on the three years before its first day and predicts one quarter (January, April, July,
# October). The handler below is RQuant's own, so the run takes the lean LightGBM path.

rolling:
  refit: true
  retrain_months: 3
  sample_half_life_years: 1

task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      early_stopping_rounds: 50
      num_boost_round: 1000
      learning_rate: 0.0421
      colsample_bytree: 0.8879
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 8
      seed: 42
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: DataHandlerLP
        module_path: qlib.data.dataset.handler
        kwargs:
          instruments: sh_main
          start_time: "2010-01-01"
          end_time: "2013-12-31"
          data_loader:
            class: KunQuantDataLoader
            module_path: rquant.qlib_ext.loader
            kwargs:
              factor_root: data/factors-sh_main
              factor_set: jq240
              horizon: 1d
          infer_processors:
            - class: ProcessInf
              module_path: rquant.qlib_ext.processors
            - class: ZScoreNorm
              module_path: rquant.qlib_ext.processors
              kwargs:
                fit_start_time: "2010-01-01"
                fit_end_time: "2012-12-27"
            - class: Fillna
              module_path: rquant.qlib_ext.processors
          learn_processors:
            - class: DropnaLabel
              module_path: rquant.qlib_ext.processors
            - class: CSZScoreNorm
              module_path: qlib.data.dataset.processor
              kwargs:
                fields_group: label
          process_type: append
          drop_raw: true
      segments:
        train: ["2010-01-01", "2012-12-27"]
        valid: ["2012-07-01", "2012-12-27"]
        test: ["2013-01-01", "2013-12-31"]
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
