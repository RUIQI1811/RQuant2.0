project:
  data_root: data
  runs_root: runs
  seed: 42

data:
  formal_start: 2010-01-01
  warmup_trading_days: 300
  through: null
  # csi300 (point-in-time CSI300 members), main (Shanghai/Shenzhen main board without ChiNext, STAR, Beijing, ST names
  # or the first 60 trading days after listing), sh_main (the Shanghai 60xxxx part of main) or all.
  # `rquant --universe sh_main ...` overrides it for one command.
  universe: sh_main
  benchmark: SH000300
  tushare_index_code: 399300.SZ
  max_requests_per_minute: 190
  sync_workers: 8
  # Financial statements (data sync-fundamentals) start at this announcement year, fetched in fixed-year windows.
  fundamentals_start_year: 2004
  fundamentals_window_years: 6

factors:
  factor_set: jq240
  dtype: double
  input_layout: TS
  output_layout: TS
  workers: 4

workflow:
  train_years: 3
  validation_months: 6
  first_prediction_year: 2013
  seed: 42

backtest:
  initial_capital: 1000000
  topk: 50
  # Fallback for legacy runs without horizon metadata. report selects by_horizon for current training runs.
  n_drop: 50
  rebalance_days: 5
  by_horizon:
    5d:
      topk: 50
      n_drop: 50
      rebalance_days: 5
    1d:
      topk: 50
      n_drop: 5
      rebalance_days: 1
  trade_unit: 100
  commission_rate: 0.0003
  minimum_commission: 5.0
  stamp_tax_before_2023_08_28: 0.001
  stamp_tax_from_2023_08_28: 0.0005
  impact_cost: 0.0
