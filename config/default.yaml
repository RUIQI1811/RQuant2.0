project:
  data_root: data
  runs_root: runs
  seed: 42

data:
  formal_start: 2010-01-01
  warmup_trading_days: 300
  through: null
  # csi300 (point-in-time CSI300 members), main (Shanghai/Shenzhen main board without ChiNext, STAR, Beijing, ST names
  # or the first 60 trading days after listing) or all. `rquant --universe main ...` overrides it for one command.
  universe: csi300
  benchmark: SH000300
  tushare_index_code: 399300.SZ
  max_requests_per_minute: 190
  sync_workers: 8
  # Financial statements (data sync-fundamentals) start at this announcement year, fetched in fixed-year windows.
  fundamentals_start_year: 2004
  fundamentals_window_years: 6

factors:
  factor_set: Hquality
  dtype: double
  input_layout: TS
  output_layout: TS
  workers: 4

workflow:
  train_years: 3
  validation_months: 6
  first_prediction_year: 2013
  seed: 42

backtest:
  initial_capital: 1000000
  topk: 50
  # n_drop == topk with rebalance_days 5: every 5 trading days the book is reset to the latest top 50.
  # The earlier daily TopkDropout (drop at most 5 per day) is n_drop 5, rebalance_days 1.
  n_drop: 50
  rebalance_days: 5
  trade_unit: 100
  commission_rate: 0.0003
  minimum_commission: 5.0
  stamp_tax_before_2023_08_28: 0.001
  stamp_tax_from_2023_08_28: 0.0005
  impact_cost: 0.0
