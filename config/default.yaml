project:
  data_root: data
  runs_root: runs
  seed: 42

data:
  formal_start: 2010-01-01
  warmup_trading_days: 300
  through: null
  # csi300 (point-in-time CSI300 members), main (Shanghai/Shenzhen main board without ChiNext, STAR, Beijing, ST names
  # or the first 60 trading days after listing), sh_main (the Shanghai 60xxxx part of main) or all.
  # `rquant --universe sh_main ...` overrides it for one command.
  universe: csi300
  benchmark: SH000300
  tushare_index_code: 399300.SZ
  max_requests_per_minute: 190
  sync_workers: 8
  # Financial statements (data sync-fundamentals) start at this announcement year, fetched in fixed-year windows.
  fundamentals_start_year: 2004
  fundamentals_window_years: 6

factors:
  factor_set: jq240
  dtype: double
  input_layout: TS
  output_layout: TS
  workers: 4

workflow:
  train_years: 3
  validation_months: 6
  first_prediction_year: 2013
  seed: 42

backtest:
  initial_capital: 1000000
  topk: 50
  # n_drop == topk with rebalance_days 5: every 5 trading days the book is reset to the latest top 50.
  # The earlier daily TopkDropout (drop at most 5 per day) is n_drop 5, rebalance_days 1.
  n_drop: 50
  rebalance_days: 5
  trade_unit: 100
  commission_rate: 0.0003
  minimum_commission: 5.0
  stamp_tax_before_2023_08_28: 0.001
  stamp_tax_from_2023_08_28: 0.0005
  impact_cost: 0.0
  # topk-dropout: equal-weighted top K (topk, n_drop). enhanced-indexing: Qlib's EnhancedIndexingOptimizer weights the
  # universe against its own float-cap index with a 10-factor PCA risk model (`rquant report --strategy` overrides).
  strategy: topk-dropout
  enhanced_indexing:
    # structured: Shenwan L1 industries + CNE6 styles built from the barra_cne6 factor store of the run's universe
    # (build it first); statistical: Qlib's StructuredCovEstimator PCA factors of past returns.
    risk_model: structured
    risk_lookback_days: 240
    # PCA factors of the statistical model.
    risk_factors: 10
    # Half-life in days of the structured model's factor covariance and specific risk weights.
    risk_half_life: 90
    # Structured model limits on the portfolio's active exposure: weight per Shenwan L1 industry, size in standard
    # deviations, every other CNE6 style in standard deviations; null removes a limit.
    industry_deviation: 0.03
    size_deviation: 0.2
    style_deviation: null
    # lamb: larger values trade expected return for a lower tracking error.
    risk_aversion: 1.0
    # Sum of |weight changes| allowed per rebalance (0.2 = 10% of the book bought and 10% sold); 2.0 removes it.
    turnover_limit: 0.2
    # Largest weight difference from the benchmark per stock; null removes it.
    benchmark_deviation: 0.01
    # Share of the account invested; the rest is cash for costs and lot rounding.
    risk_degree: 0.95
