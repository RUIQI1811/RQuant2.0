[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rquant"
version = "0.1.0"
description = "A-share daily quantitative research framework built on Qlib, Tushare and KunQuant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Proprietary - personal non-commercial use"}
authors = [{name = "RQuant"}]
dependencies = [
  "pyqlib==0.9.7",
  "KunQuant==0.1.11",
  "tushare==1.4.29",
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "lightgbm>=4.3,<5",
  "TA-Lib==0.8.2",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  # Qlib's EnhancedIndexingOptimizer solves with ECOS, which cvxpy no longer installs; StructuredCovEstimator uses
  # scikit-learn's PCA.
  "ecos>=2.0.14,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
# Qlib's PyTorch models (walk-forward --model gru|alstm|hist|tra|gru-ts). For an NVIDIA GPU install the CUDA build
# from https://pytorch.org first, e.g. pip install torch --index-url https://download.pytorch.org/whl/cu128
nn = [
  "torch>=2.3",
]

[project.scripts]
rquant = "rquant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/rquant/runs.py" = ["UP017"]
"src/rquant/data/qlib_builder.py" = ["UP017"]
"src/rquant/cli.py" = ["UP017"]
