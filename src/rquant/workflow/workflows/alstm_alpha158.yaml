# RQuant ALSTM on Alpha158 in Qlib's qrun format (PyTorch: pip install -e ".[nn]"; a CUDA GPU is used when found).
#
# Qlib's Alpha158 ALSTM benchmark (qlib.contrib.model.pytorch_alstm_ts over TSDatasetH, 20-day windows of 20
# factors).
#
# Rolling (what RQuant runs):
#   rquant walk-forward --model alstm-alpha158
#   rquant walk-forward --workflow path/to/copy-of-this.yaml
# FilterCol names qlib_alpha158 columns, so this file only runs on qlib_alpha158; for all columns of any factor set
# use gru-ts (or drop FilterCol and set d_feat / input_size to null in a copy).
# walk-forward rolls `task` over calendar years with Qlib's RollingGen and trains each year with TrainerR through
# Qlib's own dataset. Validation is held out of training (rolling.holdout_valid).
#
# Single window with Qlib itself, from the project root (one 2013 test year on csi300):
#   qrun src/rquant/workflow/workflows/alstm_alpha158.yaml

qlib_init:
  provider_uri: data/qlib
  region: cn
  # MLflow 3 refuses its file store; SQLite keeps the runs in mlflow.db and the artifacts under ./mlruns.
  exp_manager:
    class: MLflowExpManager
    module_path: qlib.workflow.expm
    kwargs:
      uri: sqlite:///mlflow.db
      default_exp_name: rquant-qrun

market: &market csi300
benchmark: &benchmark SH000300

# Train ends two trading days before the test so no 1d label (Ref($open, -2) / Ref($open, -1) - 1) reads into it.
data_handler_config: &data_handler_config
  instruments: *market
  start_time: "2010-01-01"
  end_time: "2013-12-31"
  data_loader:
    class: KunQuantDataLoader
    module_path: rquant.qlib_ext.loader
    kwargs:
      factor_root: data/factors
      factor_set: qlib_alpha158
      horizon: 1d
  # Qlib's Alpha158 network benchmarks: 20 of the 158 factors, robust z-score clipped at 3, NaN to 0.
  infer_processors:
    - class: FilterCol
      module_path: qlib.data.dataset.processor
      kwargs:
        fields_group: feature
        # RESI5 WVMA5 RSQR5 KLEN RSQR10 CORR5 CORD5 CORR10 ROC60 RESI10 VSTD5 RSQR60 CORR60 WVMA60 STD5 RSQR20 CORD60 CORD10 CORR20 KLOW
        col_list: [a158_039, a158_139, a158_034, a158_002, a158_035, a158_089, a158_094, a158_090, a158_018, a158_040, a158_134, a158_038, a158_093, a158_143, a158_024, a158_036, a158_098, a158_095, a158_091, a158_006]
    - class: ProcessInf
      module_path: rquant.qlib_ext.processors
    - class: RobustZScoreNorm
      module_path: qlib.data.dataset.processor
      kwargs:
        fields_group: feature
        clip_outlier: true
        fit_start_time: "2010-01-01"
        fit_end_time: "2012-06-28"
    - class: Fillna
      module_path: qlib.data.dataset.processor
      kwargs:
        fields_group: feature
  learn_processors:
    - class: DropnaLabel
      module_path: rquant.qlib_ext.processors
    - class: CSZScoreNorm
      module_path: qlib.data.dataset.processor
      kwargs:
        fields_group: label
  process_type: append
  # SignalRecord saves the raw label for SigAnaRecord only when the raw panel is kept.
  drop_raw: false

port_analysis_config: &port_analysis_config
  strategy:
    class: LiquidatingTopkDropoutStrategy
    module_path: rquant.qlib_ext.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
      rebalance_days: 1
      risk_degree: 1.0
      hold_thresh: 1
      only_tradable: true
      forbid_all_trade_at_limit: false
  executor:
    class: ZeroOrderSafeSimulatorExecutor
    module_path: rquant.qlib_ext.executor
    kwargs:
      time_per_step: day
      generate_portfolio_metrics: true
      verbose: false
  backtest:
    start_time: null
    end_time: null
    account: 1000000
    benchmark: *benchmark
    exchange_kwargs:
      exchange:
        class: AshareExchange
        module_path: rquant.qlib_ext.exchange
        kwargs:
          freq: day
          start_time: "2013-01-01"
          end_time: "2014-01-02"
          # Every instrument, so holdings that leave the index can still be sold.
          codes: all
          trade_unit: 100
          cost_model:
            commission_rate: 0.0003
            minimum_commission: 5.0
            stamp_tax_before: 0.001
            stamp_tax_after: 0.0005

rolling:
  # Train stops two trading days before the six validation months, which the network early-stops on.
  holdout_valid: true

task:
  model:
    class: ALSTM
    module_path: qlib.contrib.model.pytorch_alstm_ts
    kwargs:
      d_feat: 20
      hidden_size: 64
      num_layers: 2
      dropout: 0.0
      n_epochs: 200
      lr: 0.001
      early_stop: 10
      batch_size: 800
      metric: loss
      loss: mse
      # Load batches in the training process: DataLoader workers each get a copy of the window's samples on
      # Windows (spawn), several GB on sh_main.
      n_jobs: 0
      GPU: 0
      seed: 42
      rnn_type: GRU
  dataset:
    class: TSDatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: DataHandlerLP
        module_path: qlib.data.dataset.handler
        kwargs: *data_handler_config
      segments:
        train: ["2010-01-01", "2012-06-28"]
        valid: ["2012-07-02", "2012-12-27"]
        test: ["2013-01-01", "2013-12-31"]
      step_len: 20
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        ana_long_short: false
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        config: *port_analysis_config
        risk_analysis_freq: day
        indicator_analysis_freq: day
